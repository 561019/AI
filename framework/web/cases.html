<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>多案例全链路验收台</title><style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#172033;--muted:#667085;--line:#dce4ef;--blue:#315ed5;--green:#11815f;--red:#c43e4f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,"Microsoft YaHei",sans-serif}.wrap{max-width:1500px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.top h1{margin:0}.top a{color:var(--blue);margin-left:15px}.grid{display:grid;grid-template-columns:310px 1fr;gap:15px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.case{width:100%;text-align:left;border:1px solid var(--line);border-radius:10px;background:#fff;padding:12px;margin-top:9px;cursor:pointer}.case.active{border-color:var(--blue);background:#f3f6ff}.case b,.case small{display:block}.case small{color:var(--muted)}textarea{width:100%;height:90px;border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit}.actions{display:flex;gap:8px;margin-top:10px}.btn{border:0;border-radius:9px;padding:9px 14px;font-weight:700;cursor:pointer}.primary{background:var(--blue);color:#fff}.allow{background:var(--green);color:#fff}.deny{background:var(--red);color:#fff}.btn:disabled{opacity:.5}.state{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.metric{border:1px solid var(--line);border-radius:9px;padding:9px}.metric small,.metric b{display:block}.metric small{color:var(--muted}.notice{padding:12px;border-radius:9px;background:#f7f9fc;white-space:pre-wrap}.chain{margin-top:14px}.call{border:1px solid var(--line);border-radius:11px;margin:9px 0;overflow:hidden}.call summary{cursor:pointer;padding:12px;display:grid;grid-template-columns:40px 1fr 100px;gap:8px;align-items:center}.num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#e8edff;color:var(--blue);font-weight:700}.route small{display:block;color:var(--muted)}.ok{color:var(--green);font-weight:700}.bad{color:var(--red);font-weight:700}.io{display:grid;grid-template-columns:1fr 1fr;background:var(--line);gap:1px}.payload{background:#101828;color:#d1fae5;padding:12px;min-width:0}.payload h4{color:#a5b4fc;margin:0 0 6px}.payload pre{white-space:pre-wrap;word-break:break-word;max-height:360px;overflow:auto;font:11px/1.5 Consolas,monospace}@media(max-width:900px){.grid{grid-template-columns:1fr}.state{grid-template-columns:1fr 1fr}.io{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><header class="top"><div><h1>多案例全链路验收台</h1><div style="color:var(--muted)">每个模块均显示中文名称、接收内容与输出内容</div></div><nav><a href="/chat">普通对话</a><a href="/monitor">Trace 查询</a></nav></header><div class="grid"><aside class="card"><h3>选择测试案例</h3><button class="case active" data-id="rule"><b>案例一：规则计算</b><small>完整流程实例、权限、声明式规则计算</small></button><button class="case" data-id="content"><b>案例二：内容产出</b><small>任务适配、权限、DeepSeek 内容生成</small></button><button class="case" data-id="denied"><b>案例三：权限拒绝</b><small>验证拒绝后目标业务引擎不再执行</small></button><button class="case" data-id="reject"><b>案例四：人工驳回</b><small>验证意图确认处结束流程</small></button><hr style="border:0;border-top:1px solid var(--line);margin:16px 0"><label><b>对话输入</b></label><textarea id="text"></textarea><div class="actions"><button id="start" class="btn primary">提交对话</button><button id="decide" class="btn allow" disabled>确认并执行</button><button id="reject" class="btn deny" disabled>人工驳回</button></div></aside><section><div class="card"><div class="state"><div class="metric"><small>任务状态</small><b id="state">未开始</b></div><div class="metric"><small>目标能力</small><b id="capability">—</b></div><div class="metric"><small>流程实例</small><b id="flow">—</b></div><div class="metric"><small>最终结果</small><b id="result">—</b></div></div><div id="notice" class="notice">请选择案例并提交。系统会在下方实时展示每个模块接收到和输出的 JSON。</div><div style="margin-top:8px;color:var(--muted)">Trace ID：<code id="trace">—</code></div></div><section class="chain"><h2>模块接口输入输出</h2><div id="calls" class="card">尚无接口记录</div></section></section></div></main><script>
const $=s=>document.querySelector(s),uuid=()=>crypto.randomUUID();
const scenarios={rule:{text:'计算三笔项目费用合计，金额分别为1200元、350.5元和80元',mode:'normal'},content:{text:'为智能巡检终端写一份200字左右的新品发布内部通知，面向销售团队',mode:'normal'},denied:{text:'计算两笔销售业绩合计，金额分别为5000元和2680.5元',mode:'denied'},reject:{text:'计算七月份两笔销售业绩合计，金额分别为10000元和2680.5元',mode:'reject'}};
const moduleNames={'chat-validation':'对话验收页面','application-gateway':'应用层网关','engine-gateway':'业务引擎层网关','intent-adapter':'意图分析平台适配器','intent-analysis-engine-original':'原意图分析引擎','foundation-gateway':'基础模块层接口网关','model-dispatcher':'大模型统一调度模块','deepseek':'DeepSeek 大模型 API','capability-registry':'能力注册中心','workflow-execution':'流程执行平台适配器','workflow-execution-engine-original':'原完整流程执行引擎','template-management':'L1.2 流程模板管理','permission-adapter':'权限管理模块','rule-adapter':'规则计算平台适配器','rule-calculation-engine-original':'原规则计算引擎','content-adapter':'内容产出平台适配器','content-production-engine-original':'原内容产出引擎'};
const layerNames={business_application:'业务应用层',business_engine:'业务引擎层',foundation:'基础模块层（L1）',external_provider:'外部模型服务',external:'外部调用'};
let selected='rule',taskId,traceId,confirmationId;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(x){return esc(JSON.stringify(x,null,2))}
function choose(id){selected=id;document.querySelectorAll('.case').forEach(x=>x.classList.toggle('active',x.dataset.id===id));$('#text').value=scenarios[id].text;reset()}document.querySelectorAll('.case').forEach(x=>x.onclick=()=>choose(x.dataset.id));
function reset(){taskId=confirmationId=null;$('#state').textContent='未开始';$('#capability').textContent=$('#flow').textContent=$('#result').textContent='—';$('#trace').textContent='—';$('#notice').textContent='等待提交';$('#calls').innerHTML='尚无接口记录';$('#decide').disabled=$('#reject').disabled=true}
async function api(url,opt){const r=await fetch(url,opt),b=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(b.error?.code||`HTTP ${r.status}`),{body:b});return b}
async function submit(){reset();traceId=uuid();$('#trace').textContent=traceId;$('#state').textContent='正在分析意图';const env={protocol_version:'1.0',message_id:uuid(),request_id:uuid(),trace_id:traceId,parent_request_id:null,source:{layer:'business_application',module:'chat-validation'},target:{layer:'business_engine',module:'engine-gateway',capability:'intent.analyze'},actor:{tenant_id:'demo-tenant',user_id:'demo-user',authenticated:true},context:{project_id:'multi-case-validation',conversation_id:uuid(),locale:'zh-CN'},request_type:'execute',action:'intent.analyze',payload:{utterance:$('#text').value.trim()},expected_response:{mode:'async'},idempotency_key:'cases-'+uuid(),deadline_at:new Date(Date.now()+120000).toISOString()};try{const r=await api('/api/v1/application/instructions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(env)});taskId=r.task_id;await poll()}catch(e){$('#notice').textContent='提交失败：'+e.message}await loadTrace()}
async function poll(){for(let i=0;i<100;i++){const t=await api('/api/v1/tasks/'+taskId);$('#state').textContent=t.state;const data=t.result_ref?.data||{};const intent=data.tasks?.[0];if(intent)$('#capability').textContent=intent.capability_code||'—';if(t.state==='waiting_human'){confirmationId=t.confirmation_ref.id;$('#notice').textContent=`意图分析完成\n目标能力：${intent?.capability_code||'—'}\n原任务类型：${intent?.parameters?.original_task_type||'—'}\n模型：${data.model_call?.provider||'—'} / ${data.model_call?.model||'—'}\n请确认或驳回。`;$('#decide').disabled=$('#reject').disabled=false;await loadTrace();return}if(['succeeded','failed'].includes(t.state)){showFinal(t);await loadTrace();return}await new Promise(r=>setTimeout(r,400))}}
async function decide(choice){$('#decide').disabled=$('#reject').disabled=true;const body={decision:choice,actor:{tenant_id:'demo-tenant',user_id:'demo-user',authenticated:true},simulate_permission_denied:scenarios[selected].mode==='denied'};try{await api(`/api/v1/confirmations/${confirmationId}/decisions`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}catch(e){$('#notice').textContent='执行接口返回：'+e.message}await poll()}
function readableResult(r,c,t){if(c.content)return c.content;if(c.value!=null)return `计算结果：${c.value} ${c.unit||''}`.trim();if(r.permission?.decision&&r.permission.decision!=='allow')return `权限结论：${r.permission.decision}\n拒绝原因：${r.permission.reason||r.permission.message||'未返回原因'}`;return t.error?.message||t.error?.code||t.state}
function showFinal(t){const r=t.result_ref||{},c=r.capability_result||{},w=r.workflow_instance||{},text=readableResult(r,c,t);$('#flow').textContent=w.instance_id||'未创建';$('#result').textContent=c.value!=null?`${c.value} ${c.unit||''}`:(c.content?c.content.slice(0,50)+'…':t.error?.code||t.state);$('#notice').textContent=`任务状态：${t.state}\n流程类型：${w.route_type||'—'}\n流程状态：${w.status||'—'}\n承办模块：${r.provider_module||'—'}\n权限结论：${r.permission?.decision||'—'}\n\n处理后返回内容：\n${text}\n\n原始接口返回（capability_result）：\n${JSON.stringify(c,null,2)}`}
async function loadTrace(){if(!traceId)return;const b=await api('/api/v1/traces/'+traceId+'/calls');render(b.items||[])}
function render(items){$('#calls').innerHTML=items.length?items.map((x,i)=>{const s=moduleNames[x.source_module]||x.source_module||'外部请求方',t=moduleNames[x.target_module]||x.target_module||'未知模块',sl=layerNames[x.source_layer]||x.source_layer||'外部',tl=layerNames[x.target_layer]||x.target_layer||'未知层';return `<details class="call" ${i===items.length-1?'open':''}><summary><span class="num">${i+1}</span><span class="route"><b>${esc(s)} → ${esc(t)}</b><small>${esc(sl)} → ${esc(tl)}｜能力：${esc(x.capability)}｜接口：${esc(x.method)} ${esc(x.url)}</small></span><span class="${x.status_code<400?'ok':'bad'}">HTTP ${x.status_code}<br>${Number(x.duration_ms||0).toFixed(1)} ms</span></summary><div class="io"><div class="payload"><h4>${esc(t)} 接收到的内容（Request）</h4><pre>${fmt(x.request)}</pre></div><div class="payload"><h4>${esc(t)} 输出的内容（Response）</h4><pre>${fmt(x.response)}</pre></div></div></details>`}).join(''):'尚无接口记录'}
$('#start').onclick=submit;$('#decide').onclick=()=>decide('confirm');$('#reject').onclick=()=>decide('reject');choose('rule');
</script></body></html>
