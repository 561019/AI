<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>全模块接口验收</title>
  <style>
    :root{--bg:#f4f6fb;--card:#fff;--ink:#172033;--muted:#667085;--line:#dce4ef;--blue:#315ed5;--green:#11815f;--red:#c43e4f;--amber:#a15c00}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,"Microsoft YaHei",sans-serif}
    .wrap{max-width:1600px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:16px}
    h1{margin:0 0 4px;font-size:24px}.muted{color:var(--muted)}a{color:var(--blue);text-decoration:none;margin-left:12px}
    .layout{display:grid;grid-template-columns:390px 1fr;gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px}
    .toolbar{display:flex;gap:8px;margin:12px 0}.btn{border:0;border-radius:9px;padding:9px 13px;font-weight:700;cursor:pointer}.primary{background:var(--blue);color:#fff}.ghost{background:#edf2ff;color:var(--blue)}
    .layerTitle{margin:16px 0 8px;font-weight:800}.case{width:100%;border:1px solid var(--line);border-radius:11px;background:#fff;margin:7px 0;padding:11px;text-align:left;cursor:pointer}
    .case:hover{border-color:#9bb1ef}.case.active{border-color:var(--blue);background:#f5f7ff}.case b,.case small{display:block}.case small{color:var(--muted)}.tag{display:inline-block;border-radius:999px;background:#eef2ff;color:var(--blue);font-size:11px;padding:2px 7px;margin-left:5px}.state{float:right;font-size:12px;font-weight:800}.passed{color:var(--green)}.failed{color:var(--red)}.upstream_unavailable{color:var(--amber)}
    .summary{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:12px}.metric{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}.metric b{display:block;font-size:18px}.metric span{color:var(--muted);font-size:12px}
    .moduleHead{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.moduleHead h2{margin:0;font-size:20px}.capList{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
    .notice{background:#f8fafc;border:1px dashed #c6d1e1;border-radius:12px;padding:12px;white-space:pre-wrap;margin-bottom:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.panel{background:#101828;border-radius:12px;padding:12px;min-width:0}.panel h3{font-size:12px;color:#a5b4fc;margin:0 0 8px}.panel pre{color:#d1fae5;white-space:pre-wrap;word-break:break-word;max-height:360px;overflow:auto;font:11px/1.5 Consolas,monospace;margin:0}
    .call{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:10px 0;background:#fff}.call summary{display:grid;grid-template-columns:34px minmax(250px,1fr) 120px;gap:10px;align-items:center;padding:12px;cursor:pointer}.num{width:28px;height:28px;border-radius:50%;background:#e9efff;color:var(--blue);font-weight:800;display:grid;place-items:center}.route b,.route small{display:block}.route small{color:var(--muted)}.status{text-align:right;font-weight:800}.io{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-top:1px solid var(--line)}.empty{padding:42px;text-align:center;color:var(--muted)}
    @media(max-width:1000px){.layout{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}.two,.io{grid-template-columns:1fr}.call summary{grid-template-columns:34px 1fr}.status{display:none}}
  </style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <div>
      <h1>全模块接口验收</h1>
      <div class="muted">逐个验证 L2 十四个业务引擎、L1 十五个基础模块，并展示每个接口的传输内容。</div>
    </div>
    <nav><a href="/chat">对话验证</a><a href="/cases">案例验证</a><a href="/monitor">Trace 查询</a><a href="/docs">接口目录</a></nav>
  </header>

  <section class="summary">
    <div class="metric"><b id="total">0</b><span>模块数</span></div>
    <div class="metric"><b id="done">0</b><span>已验证</span></div>
    <div class="metric"><b id="passed">0</b><span>接口通过</span></div>
    <div class="metric"><b id="upstream">0</b><span>真实上游未启动</span></div>
    <div class="metric"><b id="failed">0</b><span>失败</span></div>
  </section>

  <div class="layout">
    <aside class="card">
      <b>模块列表</b>
      <div class="toolbar">
        <button class="btn primary" id="runAll">依次验证全部模块</button>
        <button class="btn ghost" id="reload">刷新列表</button>
      </div>
      <div id="caseList" class="empty">正在加载模块清单...</div>
    </aside>

    <section>
      <div class="card">
        <div class="moduleHead">
          <div>
            <h2 id="moduleName">请选择一个模块</h2>
            <div class="muted" id="moduleMeta">点击左侧模块后运行验证。</div>
            <div class="capList" id="capList"></div>
          </div>
          <button class="btn primary" id="runOne" disabled>验证当前模块</button>
        </div>
        <div class="notice" id="notice">这里会显示：平台调用哪个接口、HTTP 状态、模块是成功返回还是因为真实交付模块未启动而返回 UPSTREAM_UNAVAILABLE。</div>
        <div class="two">
          <div class="panel"><h3>本次模块标准接口请求 Request</h3><pre id="mainReq">{}</pre></div>
          <div class="panel"><h3>本次模块标准接口响应 Response</h3><pre id="mainResp">{}</pre></div>
        </div>
      </div>
      <h2>调用链与接口传输内容</h2>
      <div id="calls" class="card empty">尚无调用链记录</div>
    </section>
  </div>
</main>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=x=>JSON.stringify(x??{},null,2);
let cases=[], selected=null, results={};

async function api(url,opt){const r=await fetch(url,opt);const b=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(b.error?.code||`HTTP ${r.status}`),{body:b});return b}
async function loadCases(){
  const data=await api('/api/v1/module-verification/cases');
  cases=data.items||[]; selected=selected||cases[0]; renderCases(); selectCase(selected.case_id); updateSummary();
}
function groupCases(){
  return {
    'L2 业务引擎层': cases.filter(x=>x.layer==='business_engine'),
    'L1 基础模块层': cases.filter(x=>x.layer==='foundation')
  };
}
function renderCases(){
  const groups=groupCases();
  $('#caseList').innerHTML=Object.entries(groups).map(([name,items])=>`<div class="layerTitle">${name} <span class="tag">${items.length}</span></div>`+items.map(item=>{
    const r=results[item.case_id]; const state=r?`<span class="state ${r.result_status}">${label(r.result_status)}</span>`:'';
    return `<button class="case ${selected&&selected.case_id===item.case_id?'active':''}" data-id="${esc(item.case_id)}"><b>${esc(item.module_name_cn)} ${state}</b><small>${esc(item.service_name)} · ${esc(item.capability)} · ${item.port}${esc(item.endpoint)}</small></button>`
  }).join('')).join('');
  document.querySelectorAll('.case').forEach(btn=>btn.onclick=()=>selectCase(btn.dataset.id));
}
function selectCase(id){
  selected=cases.find(x=>x.case_id===id)||selected; renderCases();
  if(!selected)return;
  $('#runOne').disabled=false;
  $('#moduleName').textContent=selected.module_name_cn;
  $('#moduleMeta').textContent=`${selected.layer_cn} · 服务名：${selected.service_name} · 标准入口：http://127.0.0.1:${selected.port}${selected.endpoint}`;
  $('#capList').innerHTML=(selected.all_capabilities||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join('');
  const r=results[selected.case_id];
  if(r) renderResult(r); else {$('#mainReq').textContent='{}';$('#mainResp').textContent='{}';$('#calls').innerHTML='<div class="empty">尚未验证当前模块</div>';$('#notice').textContent='点击“验证当前模块”查看该模块标准接口的请求、响应和调用链。'}
}
function label(s){return {passed:'通过',failed:'失败',upstream_unavailable:'上游未启动'}[s]||s}
async function runCase(id){
  const item=cases.find(x=>x.case_id===id); if(!item)return;
  selected=item; renderCases();
  $('#notice').textContent=`正在验证 ${item.module_name_cn} ...`;
  const r=await api('/api/v1/module-verification/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({case_id:id})});
  results[id]=r; renderResult(r); renderCases(); updateSummary();
}
async function runAll(){
  $('#runAll').disabled=true;
  for(const item of cases){
    try{await runCase(item.case_id)}catch(e){results[item.case_id]={case:item,result_status:'failed',response:e.body||{error:e.message},request:{},calls:[]}; renderCases(); updateSummary()}
  }
  $('#runAll').disabled=false;
}
function renderResult(r){
  selected=r.case;
  $('#moduleName').textContent=r.case.module_name_cn;
  $('#notice').textContent=[
    `验证模块：${r.case.module_name_cn}`,
    `平台标准接口：${r.request_url}`,
    `代表能力：${r.case.capability}`,
    `HTTP 状态：${r.http_status}`,
    `验收结论：${label(r.result_status)}`,
    r.result_status==='upstream_unavailable'?'说明：平台适配器已收到请求，但对应真实交付模块未启动或上游地址不可达。':''
  ].filter(Boolean).join('\n');
  $('#mainReq').textContent=fmt(r.request);
  $('#mainResp').textContent=fmt(r.response);
  renderCalls(r.calls||[]);
}
function renderCalls(items){
  $('#calls').innerHTML=items.length?items.map((x,i)=>`<details class="call" ${i===items.length-1?'open':''}><summary><span class="num">${i+1}</span><span class="route"><b>${esc(x.source_module||'外部')} → ${esc(x.target_module||'未知模块')}</b><small>${esc(x.source_layer||'external')} → ${esc(x.target_layer||'unknown')} · 能力：${esc(x.capability)} · ${esc(x.method)} ${esc(x.url)}</small></span><span class="status ${x.status_code>=400?'failed':'passed'}">HTTP ${x.status_code}<br>${Number(x.duration_ms||0).toFixed(1)} ms</span></summary><div class="io"><div class="panel"><h3>目标模块接收到的内容 Request</h3><pre>${esc(fmt(x.request))}</pre></div><div class="panel"><h3>目标模块输出的内容 Response</h3><pre>${esc(fmt(x.response))}</pre></div></div></details>`).join(''):'<div class="empty">没有调用链记录。请确认平台服务已启动。</div>';
}
function updateSummary(){
  const values=Object.values(results);
  $('#total').textContent=cases.length; $('#done').textContent=values.length;
  $('#passed').textContent=values.filter(x=>x.result_status==='passed').length;
  $('#upstream').textContent=values.filter(x=>x.result_status==='upstream_unavailable').length;
  $('#failed').textContent=values.filter(x=>x.result_status==='failed').length;
}
$('#runOne').onclick=()=>selected&&runCase(selected.case_id);
$('#runAll').onclick=runAll;
$('#reload').onclick=loadCases;
loadCases().catch(e=>{$('#caseList').innerHTML=`<div class="empty">加载失败：${esc(e.message)}</div>`});
</script>
</body>
</html>
