<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>平台接口调用监控</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#172033;--muted:#667085;--line:#dce3ed;--blue:#315ed5;--green:#16835f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif}.wrap{max-width:1280px;margin:auto;padding:25px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.top h1{margin:0;font-size:22px}.top a{color:var(--blue)}.search{display:flex;gap:9px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:18px}input{flex:1;border:0;outline:0;padding:8px;font:13px ui-monospace,Consolas,monospace}.btn{border:0;background:var(--blue);color:#fff;border-radius:9px;padding:9px 18px;cursor:pointer}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.metric{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}.metric b{display:block;font-size:20px}.metric span{color:var(--muted);font-size:12px}.empty{padding:60px;text-align:center;color:var(--muted);background:#fff;border:1px dashed #bbc7d8;border-radius:14px}.call{background:#fff;border:1px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden}.call summary{cursor:pointer;display:grid;grid-template-columns:38px minmax(180px,1fr) 120px 90px;align-items:center;gap:12px;padding:15px}.call summary:hover{background:#f8faff}.n{width:30px;height:30px;border-radius:50%;background:#e7edff;color:var(--blue);display:grid;place-items:center;font-weight:700}.route b,.route small{display:block}.route small{color:var(--muted)}.status{font-weight:700;color:var(--green)}.bad{color:#c23b3b}.duration{text-align:right;color:var(--muted)}.detail{border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}.payload{background:#101828;padding:14px;min-width:0}.payload h3{color:#a5b4fc;font-size:12px;margin:0 0 8px}.payload pre{color:#d1fae5;white-space:pre-wrap;word-break:break-word;max-height:420px;overflow:auto;font:11px/1.5 ui-monospace,Consolas,monospace}.pill{display:inline-block;padding:2px 7px;border-radius:10px;background:#eef2ff;color:var(--blue);font-size:11px;margin-left:5px}@media(max-width:760px){.summary{grid-template-columns:1fr 1fr}.call summary{grid-template-columns:32px 1fr}.duration,.status{display:none}.detail{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><header class="top"><div><h1>平台接口调用监控</h1><div style="color:var(--muted)">按 Trace ID 查看层间及层内模块的真实 HTTP 请求和响应</div></div><a href="/chat">返回对话联调台</a></header><form class="search" id="form"><input id="trace" placeholder="粘贴对话页面中的 Trace ID" required><button class="btn">查询调用链</button></form><section class="summary"><div class="metric"><b id="count">0</b><span>接口调用次数</span></div><div class="metric"><b id="layers">0</b><span>经过层数</span></div><div class="metric"><b id="modules">0</b><span>调用模块数</span></div><div class="metric"><b id="duration">0 ms</b><span>累计接口耗时</span></div></section><section id="calls"><div class="empty">先在对话联调台完成一个案例，再输入 Trace ID 查看完整传输内容。</div></section></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt(x){return esc(JSON.stringify(x,null,2))}function render(items){$('#count').textContent=items.length;$('#layers').textContent=new Set(items.flatMap(x=>[x.source_layer,x.target_layer]).filter(Boolean)).size;$('#modules').textContent=new Set(items.flatMap(x=>[x.source_module,x.target_module]).filter(Boolean)).size;$('#duration').textContent=items.reduce((a,x)=>a+(x.duration_ms||0),0).toFixed(1)+' ms';$('#calls').innerHTML=items.length?items.map((x,i)=>`<details class="call" ${i===0?'open':''}><summary><span class="n">${i+1}</span><span class="route"><b>${esc(x.source_module||'外部调用')} → ${esc(x.target_module||'未知模块')} <i class="pill">${esc(x.capability)}</i></b><small>${esc(x.source_layer||'external')} → ${esc(x.target_layer||'unknown')} · ${esc(x.method)} ${esc(x.url)}</small></span><span class="status ${x.status_code>=400?'bad':''}">HTTP ${x.status_code}</span><span class="duration">${x.duration_ms} ms</span></summary><div class="detail"><div class="payload"><h3>请求内容 Request</h3><pre>${fmt(x.request)}</pre></div><div class="payload"><h3>响应内容 Response</h3><pre>${fmt(x.response)}</pre></div></div></details>`).join(''):'<div class="empty">该 Trace ID 暂无接口调用记录。</div>'}
async function load(id){history.replaceState(null,'','?trace_id='+encodeURIComponent(id));const r=await fetch('/api/v1/traces/'+encodeURIComponent(id)+'/calls');const b=await r.json();render(b.items||[])}$('#form').onsubmit=e=>{e.preventDefault();load($('#trace').value.trim())};const initial=new URLSearchParams(location.search).get('trace_id');if(initial){$('#trace').value=initial;load(initial)}
</script></body></html>
