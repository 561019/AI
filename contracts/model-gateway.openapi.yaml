openapi: 3.1.0
info: { title: 大模型统一调度 API, version: 0.1.0-draft }
paths:
  /api/v1/models/responses:
    post:
      operationId: createModelResponse
      description: 业务引擎只能调用本接口，不得直连模型厂商。
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ModelRequest' } } }
      responses:
        '200':
          description: 模型调用完成
          content: { application/json: { schema: { $ref: '#/components/schemas/ModelResponse' } } }
        '429': { description: 模型限流 }
        '502': { description: 模型输出无效或上游失败 }
components:
  schemas:
    Message:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [system, user, assistant, tool] }
        content: { type: string }
      additionalProperties: false
    ModelPolicy:
      type: object
      required: [quality_level, allow_fallback, sensitive_data]
      properties:
        quality_level: { type: string, enum: [economy, standard, high] }
        allow_fallback: { type: boolean }
        sensitive_data: { type: boolean }
        preferred_model_ref: { $ref: './common-envelope.openapi.yaml#/components/schemas/ResourceRef' }
        max_output_tokens: { type: integer, minimum: 1 }
        temperature: { type: number, minimum: 0, maximum: 2 }
      additionalProperties: false
    ModelRequest:
      type: object
      required: [trace_id, actor, task_type, messages, model_policy]
      properties:
        trace_id: { type: string, format: uuid }
        actor: { $ref: './common-envelope.openapi.yaml#/components/schemas/Actor' }
        task_type: { type: string, enum: [intent_analysis, document_understanding, knowledge_answer, content_generation, analytical_reasoning, vision, image_generation] }
        messages: { type: array, minItems: 1, items: { $ref: '#/components/schemas/Message' } }
        input_refs: { type: array, items: { $ref: './common-envelope.openapi.yaml#/components/schemas/ResourceRef' } }
        response_schema: { type: object, additionalProperties: true }
        model_policy: { $ref: '#/components/schemas/ModelPolicy' }
      additionalProperties: false
    ModelResponse:
      type: object
      required: [trace_id, model_call_id, provider, model, output, usage]
      properties:
        trace_id: { type: string, format: uuid }
        model_call_id: { type: string }
        provider: { type: string }
        model: { type: string }
        output: { type: object, additionalProperties: true }
        usage:
          type: object
          required: [input_tokens, output_tokens]
          properties:
            input_tokens: { type: integer, minimum: 0 }
            output_tokens: { type: integer, minimum: 0 }
            estimated_cost: { type: number, minimum: 0 }
          additionalProperties: false
        fallback_used: { type: boolean }
      additionalProperties: false
