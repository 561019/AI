<!DOCTYPE html><html lang="zh-CN" data-theme="light"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>分析预测引擎 - AI对话</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>
<style>:root{--s1:#fcfcfb;--sp:#f9f9f7;--tp:#0b0b0b;--ts:#52514e;--tm:#898781;--gl:#e1e0d9;--bl:#c3c2b7;--br:rgba(11,11,11,.1);--c1:#2a78d6;--c2:#008300;--c6:#eb6834;--c7:#4a3aa7;--r:6px;--r2:10px;--shadow:0 1px 3px rgba(0,0,0,.06);--font:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}:root[data-theme=dark]{--s1:#1a1a19;--sp:#0d0d0d;--tp:#fff;--ts:#c3c2b7;--gl:#2c2c2a;--bl:#383835;--br:rgba(255,255,255,.1);--c1:#3987e5;--c6:#d95926;--c7:#9085e9;--shadow:0 1px 3px rgba(0,0,0,.2)}*,::before,::after{box-sizing:border-box;margin:0;padding:0}html{font-size:15px}body{font-family:var(--font);background:var(--sp);color:var(--tp);height:100vh;display:flex;flex-direction:column}.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:52px;flex-shrink:0;background:var(--s1);border-bottom:1px solid var(--gl)}.topbar-l{display:flex;align-items:center;gap:10px}.topbar-logo{font-size:1.1rem;font-weight:700}.topbar-sub{font-size:.7rem;color:var(--tm)}.topbar-r{display:flex;align-items:center;gap:12px}.topbar-link{font-size:.8rem;color:var(--c1);text-decoration:none}.topbar-link:hover{text-decoration:underline}.theme-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--br);background:var(--s1);cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center}.suggs{display:flex;flex-wrap:wrap;gap:8px;padding:12px 20px;border-bottom:1px solid var(--gl);background:var(--s1);flex-shrink:0}.sugg{padding:6px 14px;border-radius:20px;border:1px solid var(--bl);background:var(--sp);cursor:pointer;font-size:.8rem;color:var(--ts);white-space:nowrap;transition:all .15s}.sugg:hover{border-color:var(--c1);color:var(--c1)}.chat-area{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}.chat-empty{text-align:center;color:var(--tm);padding-top:80px}.chat-empty h2{font-size:1.3rem;margin-bottom:8px;color:var(--ts)}.chat-empty p{font-size:.85rem}.msg{display:flex;gap:10px;max-width:90%;animation:in .3s}.msg.user{align-self:flex-end;flex-direction:row-reverse}.msg.assistant,.msg.error{align-self:flex-start}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.msg-av{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:700}.msg.user .msg-av{background:var(--c1);color:#fff}.msg.assistant .msg-av{background:var(--c7);color:#fff}.msg-bubble{padding:12px 16px;border-radius:var(--r2);line-height:1.7;font-size:.875rem;word-break:break-word;min-width:0;overflow:hidden}.msg.user .msg-bubble{background:var(--c1);color:#fff}.msg.assistant .msg-bubble{background:var(--s1);border:1px solid var(--br)}.msg-bubble h3{font-size:.95rem;margin:10px 0 4px}.msg-bubble h3:first-child{margin-top:0}.msg-bubble table{width:100%;border-collapse:collapse;margin:8px 0;font-size:.8rem}.msg-bubble td,.msg-bubble th{padding:6px 10px;text-align:left;border-bottom:1px solid var(--gl)}.msg-bubble th{font-weight:600;color:var(--tm);font-size:.7rem}.msg-bubble hr{border:none;border-top:1px solid var(--bl);margin:12px 0}.msg-bubble code{font-family:monospace;font-size:.8rem;background:var(--sp);padding:1px 5px;border-radius:3px}.msg-bubble strong{font-weight:600}.loading-dots{display:flex;gap:4px;padding:4px 0}.loading-dots span{width:6px;height:6px;border-radius:50%;background:var(--tm);animation:bounce 1.4s infinite}.loading-dots span:nth-child(2){animation-delay:.2s}.loading-dots span:nth-child(3){animation-delay:.4s}@keyframes bounce{0%,80%,to{transform:scale(0)}40%{transform:scale(1)}}.input-bar{display:flex;gap:10px;padding:14px 20px;background:var(--s1);border-top:1px solid var(--gl);flex-shrink:0}.input-field{flex:1;padding:10px 16px;border-radius:24px;border:1px solid var(--bl);background:var(--sp);font-family:var(--font);font-size:.875rem;color:var(--tp);outline:none}.input-field:focus{border-color:var(--c1)}.btn-send{width:42px;height:42px;border-radius:50%;border:none;background:var(--c1);color:#fff;cursor:pointer;font-size:1.2rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}.chat-chart{width:100%;height:300px;margin:12px 0;border-radius:var(--r)}.chat-chart.tall{height:380px}.chat-area::-webkit-scrollbar{width:5px}.chat-area::-webkit-scrollbar-thumb{background:var(--bl);border-radius:10px}</style></head><body>
<header class="topbar"><div class="topbar-l"><span class="topbar-logo">分析预测引擎</span><span class="topbar-sub">AI 对话</span></div><div class="topbar-r"><a href="/" class="topbar-link">仪表盘</a><button class="theme-btn" id="themeBtn">*</button></div></header>
<div id="monitor" style="display:flex;align-items:center;gap:16px;padding:6px 20px;background:var(--s1);border-bottom:1px solid var(--gl);font-size:.78rem;flex-shrink:0">
  <span style="font-weight:600;color:var(--ts)">实时监控</span>
  <span id="monPeriod" style="color:var(--tm)">--</span>
  <span id="monSales" style="padding:2px 10px;border-radius:10px">销售成本 --</span>
  <span id="monDelivery" style="padding:2px 10px;border-radius:10px">交付成本 --</span>
  <span id="monOp" style="padding:2px 10px;border-radius:10px">运营成本 --</span>
  <span id="monProfit" style="margin-left:auto;font-weight:600">净利润 --</span>
  <button onclick="refreshMonitor()" style="cursor:pointer;border:1px solid var(--bl);background:var(--sp);border-radius:4px;padding:2px 8px;font-size:.7rem;color:var(--ts)">刷新</button>
</div>
<div class="suggs" id="suggs"><span style="font-size:.75rem;color:var(--tm);margin-right:4px">试试：</span><button class="sugg" data-msg="2023">2023</button><button class="sugg" data-msg="2024">2024</button><button class="sugg" data-msg="2025">2025</button><button class="sugg" data-msg="Q1 2024">Q1</button></div>
<div class="chat-area" id="chatArea"><div class="chat-empty" id="chatEmpty"><h2>分析预测引擎</h2><p>输入自然语言，如"分析2023年利润表"<br>引擎计算 + 图表展示 + AI 解读</p></div></div>
<div class="input-bar"><input class="input-field" id="chatInput" placeholder="例如：分析2023年利润表..." autofocus><button class="btn-send" id="sendBtn" onclick="send()">></button></div>
<script>
var API='http://127.0.0.1:8000';
var tb=document.getElementById('themeBtn');
(function(t){document.documentElement.setAttribute('data-theme',t);tb.textContent=t==='dark'?'o':'*'})(localStorage.getItem('chat-theme')||'light');
tb.onclick=function(){var n=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);localStorage.setItem('chat-theme',n);tb.textContent=n==='dark'?'o':'*'};
document.getElementById('suggs').onclick=function(e){if(e.target.classList.contains('sugg')){document.getElementById('chatInput').value=e.target.dataset.msg;send()}};
document.getElementById('chatInput').onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();send()}};

// Real-time cost monitoring - calls engine directly via /v1/monitor/latest
async function refreshMonitor(){try{var r=await fetch(API+'/v1/monitor/latest');var d=await r.json();var period=d.period||'--';var ra=d.cost_ratios||{},cmp=d.target_comparisons||{};var ks=['sales_cost_ratio','delivery_cost_ratio','operating_cost_ratio'];var names=['销售成本','交付成本','运营成本'];var ids=['monSales','monDelivery','monOp'];document.getElementById('monPeriod').textContent=period;for(var i=0;i<3;i++){var k=ks[i],id=ids[i],el=document.getElementById(id);var a=Number(ra[k]||0),t=Number((cmp[k]||{}).target||0);var over=(cmp[k]||{}).is_exceeded;el.textContent=names[i]+' '+a.toFixed(1)+'% / '+t+'%';el.style.background=over?'#fef2f2':'#f0fdf4';el.style.color=over?'#d03b3b':'#0ca30c'}document.getElementById('monProfit').textContent='净利润 '+String(d.net_profit||'--')}catch(e){console.log(e)}
}
refreshMonitor();setInterval(refreshMonitor,30000);


function et(){var d=document.documentElement.getAttribute('data-theme')==='dark';return{isDark:d,tp:d?'#fff':'#0b0b0b',ts:d?'#c3c2b7':'#52514e',tm:d?'#898781':'#898781',gl:d?'#2c2c2a':'#e1e0d9',sf:d?'#1a1a19':'#fcfcfb',c1:d?'#3987e5':'#2a78d6',c2:d?'#008300':'#008300',c3:d?'#d55181':'#e87ba4',c4:d?'#c98500':'#eda100',c5:d?'#199e70':'#1baf7a',c6:d?'#d95926':'#eb6834',c7:d?'#9085e9':'#4a3aa7'}}
function fcn(v){if(v==null||isNaN(v))return'-';var n=Number(v);if(Math.abs(n)>=1e8)return(n/1e8).toFixed(2)+'亿';if(Math.abs(n)>=1e4)return(n/1e4).toFixed(2)+'万';return n.toLocaleString('zh-CN',{maximumFractionDigits:0})}
var CN={revenue:'营业收入',operating_cost:'营业成本',selling_expense:'销售费用',admin_expense:'管理费用',finance_expense:'财务费用',rd_expense:'研发费用',net_income:'净利润',total_assets:'总资产',total_liabilities:'总负债',equity:'所有者权益',operating_cashflow:'经营现金流',accounts_receivable:'应收账款',inventory:'存货',cash:'货币资金',fixed_assets:'固定资产',accounts_payable:'应付账款',short_term_debt:'短期借款',long_term_debt:'长期借款'};

async function send(){var v=document.getElementById('chatInput').value.trim();if(!v)return;document.getElementById('chatEmpty').style.display='none';am('user',v);document.getElementById('chatInput').value='';var lid=al();try{var r=await fetch(API+'/v1/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:v})});var d=await r.json();rl(lid);am(d.role||'assistant',d.content,d)}catch(e){rl(lid);am('error','请求失败: '+e.message)}}
function am(role,content,meta){var a=document.getElementById('chatArea'),d=document.createElement('div');d.className='msg '+role;var av={user:'U',assistant:'A',error:'!'};d.innerHTML='<div class="msg-av">'+av[role]+'</div><div class="msg-bubble">'+md(content)+'</div>';a.appendChild(d);if(meta&&meta.result)setTimeout(function(){rc(d,meta)},150);a.scrollTop=a.scrollHeight}
var lc=0;function al(){var a=document.getElementById('chatArea'),id='l-'+(++lc),d=document.createElement('div');d.className='msg assistant';d.id=id;d.innerHTML='<div class="msg-av">A</div><div class="msg-bubble"><div class="loading-dots"><span></span><span></span><span></span></div></div>';a.appendChild(d);a.scrollTop=a.scrollHeight;return id}
function rl(id){var e=document.getElementById(id);if(e)e.remove()}
function md(t){if(!t)return'';return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h3>$1</h3>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/(\|[^\n]+\|\n\|[-: ]+\|\n((?:\|[^\n]+\|\n?)*))/g,function(_,tb){var rs=tb.trim().split('\n'),o='<table>';rs.forEach(function(r,i){if(i===1)return;var cs=r.split('|').filter(function(c){return c.trim()}).map(function(c){return c.trim()});o+='<tr>'+cs.map(function(c,j){return'<'+(i?'td':'th')+'>'+c+'</'+(i?'td':'th')+'>'}).join('')+'</tr>'});o+='</table>';return o}).replace(/^---$/gm,'<hr>').replace(/\n\n/g,'<br><br>').replace(/\n/g,'<br>').replace(/&lt;!--CHARTS--&gt;/g,'<div id="charts-here"></div>')}

function rc(msgDiv,meta){var r=meta.result,b=msgDiv.querySelector('.msg-bubble');if(!b||!r)return;var ph=b.querySelector('#charts-here')||b;var t=r.analysis_type;if(t==='financial_statement')rfc(ph,r,meta);else if(t==='price_forecast')rpc(ph,r,meta);else if(t==='business_metric')rbc(ph,r)}

function rfc(bubble,result,meta){
  var t=et(),m=result.metrics||{},recs=meta.records;
  if(!recs||recs.length<2)return;
  // Dynamically get ALL metric keys from actual data
  var allKeys=Object.keys(recs[0].metrics||{});
  if(allKeys.length===0)return;
  var colors=[t.c1,t.c6,t.c2,t.c4,t.c5,t.c7,t.c3,t.c1,t.c6,t.c2,t.c4,t.c5,t.c7,t.c3];
  var periods=recs.map(function(r){return r.period});

  // Chart 1: Trend lines for ALL metrics in the table
  var d1=document.createElement('div');d1.className='chat-chart tall';bubble.appendChild(d1);
  var c1=echarts.init(d1);
  var s1=allKeys.map(function(k,i){return{name:CN[k]||k,type:'line',data:recs.map(function(r){return Number((r.metrics||{})[k]||0)}),lineStyle:{width:2,color:colors[i%colors.length]},symbol:'circle',symbolSize:4,itemStyle:{color:colors[i%colors.length]}}});
  c1.setOption({title:{text:'全部指标趋势 ('+periods[0]+' ~ '+periods[periods.length-1]+')',left:'center',top:8,textStyle:{fontSize:13,color:t.tp}},tooltip:{trigger:'axis',valueFormatter:function(v){return fcn(v)}},legend:{type:'scroll',data:s1.map(function(s){return s.name}),bottom:0,textStyle:{color:t.ts,fontSize:9}},grid:{left:60,right:30,top:50,bottom:55},xAxis:{type:'category',data:periods,axisLabel:{color:t.tm,rotate:45,fontSize:10}},yAxis:{type:'value',axisLabel:{color:t.tm,formatter:fcn},splitLine:{lineStyle:{color:t.gl}}},series:s1});

  // Chart 2: MoM% for ALL metrics
  var momKeys=allKeys.filter(function(k){var bp=(m[k]||{}).by_period;return bp&&bp.length>1&&bp.some(function(p){return p.period_over_period_percent!=null})});
  if(momKeys.length>0){
    var d2=document.createElement('div');d2.className='chat-chart tall';bubble.appendChild(d2);
    var c2=echarts.init(d2);
    var bpp=(m[momKeys[0]]||{}).by_period.map(function(p){return p.period});
    var s2=momKeys.map(function(k,i){var mom=(m[k]||{}).by_period.map(function(p){return p.period_over_period_percent!=null?Number(p.period_over_period_percent):null});return{name:(CN[k]||k)+' MoM%',type:'line',data:mom,lineStyle:{width:2,color:colors[i%colors.length]},symbol:'circle',symbolSize:4,itemStyle:{color:colors[i%colors.length]}}});
    c2.setOption({title:{text:'指标逐期环比变化',left:'center',top:8,textStyle:{fontSize:13,color:t.tp}},tooltip:{trigger:'axis',valueFormatter:function(v){return v!=null?v.toFixed(2)+'%':'-'}},legend:{type:'scroll',data:s2.map(function(s){return s.name}),bottom:0,textStyle:{color:t.ts,fontSize:9}},grid:{left:50,right:30,top:50,bottom:55},xAxis:{type:'category',data:bpp,axisLabel:{color:t.tm,rotate:45,fontSize:10}},yAxis:{type:'value',axisLabel:{color:t.tm,formatter:function(v){return v+'%'}},splitLine:{lineStyle:{color:t.gl}}},series:s2});
  }
  // Chart 2b: YoY% for ALL metrics
  var yoyKeys=allKeys.filter(function(k){var bp=(m[k]||{}).by_period;return bp&&bp.length>1&&bp.some(function(p){return p.year_over_year_percent!=null})});
  if(yoyKeys.length>0){var d2b=document.createElement('div');d2b.className='chat-chart tall';bubble.appendChild(d2b);var c2b=echarts.init(d2b);var bypp=(m[yoyKeys[0]]||{}).by_period.map(function(p){return p.period});var s2b=yoyKeys.map(function(k,i){var yoy=(m[k]||{}).by_period.map(function(p){return p.year_over_year_percent!=null?Number(p.year_over_year_percent):null});return{name:(CN[k]||k)+' YoY%',type:'line',data:yoy,lineStyle:{width:2,color:colors[i%colors.length]},symbol:'diamond',symbolSize:4,itemStyle:{color:colors[i%colors.length]}}});c2b.setOption({title:{text:'全部指标逐期同比变化',left:'center',top:8,textStyle:{fontSize:13,color:t.tp}},tooltip:{trigger:'axis',valueFormatter:function(v){return v!=null?v.toFixed(2)+'%':'-'}},legend:{type:'scroll',data:s2b.map(function(s){return s.name}),bottom:0,textStyle:{color:t.ts,fontSize:9}},grid:{left:50,right:30,top:50,bottom:55},xAxis:{type:'category',data:bypp,axisLabel:{color:t.tm,rotate:45,fontSize:10}},yAxis:{type:'value',axisLabel:{color:t.tm,formatter:function(v){return v+'%'}},splitLine:{lineStyle:{color:t.gl}}},series:s2b})}

  // Chart 3: DuPont (ROE decomposition over time)
  var dp=result.dupont||{},dbp=dp.by_period;if(dbp&&dbp.length>0&&dbp[0].roe_percent!=null){var d3=document.createElement('div');d3.className='chat-chart tall';bubble.appendChild(d3);var c3=echarts.init(d3);var dpp=dbp.map(function(p){return p.period});var roeD=dbp.map(function(p){return Number(p.roe_percent||0)});var nmD=dbp.map(function(p){return Number(p.net_margin_percent||0)});var atD=dbp.map(function(p){return Number(p.asset_turnover||0)});var emD=dbp.map(function(p){return Number(p.equity_multiplier||0)});c3.setOption({title:{text:'杜邦分析 - ROE逐期分解',left:'center',top:8,textStyle:{fontSize:13,color:t.tp}},tooltip:{trigger:'axis'},legend:{data:['ROE%','净利率%','周转率','杠杆'],bottom:0,textStyle:{color:t.ts,fontSize:9}},grid:{left:50,right:30,top:50,bottom:55},xAxis:{type:'category',data:dpp,axisLabel:{color:t.tm,rotate:45,fontSize:10}},yAxis:{type:'value',axisLabel:{color:t.tm},splitLine:{lineStyle:{color:t.gl}}},series:[{name:'ROE%',type:'line',data:roeD,lineStyle:{width:3,color:t.c6},symbol:'circle',symbolSize:6,itemStyle:{color:t.c6}},{name:'净利率%',type:'line',data:nmD,lineStyle:{width:2,color:t.c1},symbol:'circle',symbolSize:4,itemStyle:{color:t.c1}},{name:'周转率',type:'line',data:atD,lineStyle:{width:2,color:t.c2},symbol:'circle',symbolSize:4,itemStyle:{color:t.c2}},{name:'杠杆',type:'line',data:emD,lineStyle:{width:2,color:t.c4},symbol:'circle',symbolSize:4,itemStyle:{color:t.c4}}]})}}

function rpc(bubble,result,meta){var t=et(),fc=result.forecasts||[],recs=(meta||{}).records||[];

  // Chart 1: Historical prices
  if(recs.length>0){var d1=document.createElement('div');d1.className='chat-chart tall';bubble.appendChild(d1);var c1=echarts.init(d1);var hd=recs.map(function(r){return r.date});var hp=recs.map(function(r){return Number(r.price)});c1.setOption({title:{text:'历史价格走势 ('+recs.length+'个月)',left:'center',top:8,textStyle:{fontSize:13,color:t.tp}},tooltip:{trigger:'axis',valueFormatter:function(v){return fcn(v)}},grid:{left:50,right:30,top:50,bottom:40},xAxis:{type:'category',data:hd,axisLabel:{color:t.tm,rotate:45,fontSize:10}},yAxis:{type:'value',axisLabel:{color:t.tm,formatter:fcn},splitLine:{lineStyle:{color:t.gl}}},series:[{name:'价格',type:'line',data:hp,lineStyle:{width:2,color:t.c1},symbol:'circle',symbolSize:6,itemStyle:{color:t.c1},areaStyle:{color:t.isDark?'rgba(42,120,214,.08)':'rgba(42,120,214,.1)'}}]})}

  // Chart 2: Forecast
  if(fc.length>0){var d2=document.createElement('div');d2.className='chat-chart tall';bubble.appendChild(d2);var c2=echarts.init(d2);var fd=fc.map(function(f){return f.date});var fv=fc.map(function(f){return Number(f.value)});var fl=fc.map(function(f){return Number(f.lower)});var fu=fc.map(function(f){return Number(f.upper)});c2.setOption({title:{text:'价格预测（'+fc.length+'个月）',left:'center',top:8,textStyle:{fontSize:13,color:t.tp}},tooltip:{trigger:'axis'},legend:{data:['预测值','置信区间'],bottom:0,textStyle:{color:t.ts}},grid:{left:50,right:30,top:50,bottom:50},xAxis:{type:'category',data:fd,axisLabel:{color:t.tm,rotate:30,fontSize:10}},yAxis:{type:'value',axisLabel:{color:t.tm,formatter:fcn},splitLine:{lineStyle:{color:t.gl}}},series:[{name:'置信区间',type:'line',data:fu,lineStyle:{opacity:0},symbol:'none',areaStyle:{color:t.isDark?'rgba(57,135,229,.08)':'rgba(42,120,214,.1)'},stack:'b',stackStrategy:'all',silent:true},{name:'置信区间',type:'line',data:fl.map(function(v,i){return fu[i]-v}),lineStyle:{opacity:0},symbol:'none',areaStyle:{color:t.sf},stack:'b',silent:true},{name:'预测值',type:'line',data:fv,lineStyle:{width:2,color:t.c6,type:'dashed'},symbol:'diamond',symbolSize:10,itemStyle:{color:t.c6}}]})}
}
