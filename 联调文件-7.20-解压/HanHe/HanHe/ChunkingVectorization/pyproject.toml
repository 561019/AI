[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chunk-vector-engine"
version = "0.1.0"
description = "Chunk and vectorize standard-document/v1 packages"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pymilvus>=2.6,<3",
]

[project.scripts]
chunk-vector = "chunk_vector_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
