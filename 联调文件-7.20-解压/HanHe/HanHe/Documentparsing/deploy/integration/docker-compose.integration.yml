services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: docengine
      POSTGRES_USER: docengine
      POSTGRES_PASSWORD: docengine
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docengine"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: docengine
      MINIO_ROOT_PASSWORD: change-this-secret
    volumes:
      - minio-data:/data
    ports:
      - "9001:9001"

  api:
    build:
      context: ../..
      dockerfile: deploy/integration/Dockerfile
    env_file: ../../.env
    command: uvicorn doc_table_engine.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - service-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  worker:
    build:
      context: ../..
      dockerfile: deploy/integration/Dockerfile
    env_file: ../../.env
    command: python -m doc_table_engine.worker
    volumes:
      - service-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

volumes:
  postgres-data:
  minio-data:
  service-data:
