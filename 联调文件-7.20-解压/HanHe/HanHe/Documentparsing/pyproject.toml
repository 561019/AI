[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-table-engine"
version = "0.1.0"
description = "Traceable document and table parsing engine MVP"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1",
  "pydantic>=2.7",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "xlrd>=2.0",
  "Pillow>=11.0",
  "PyMuPDF>=1.24",
  "pyarrow>=17.0",
]

[project.optional-dependencies]
api = [
  "asyncpg>=0.29",
  "boto3>=1.34",
  "fastapi>=0.115",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30",
]

[project.scripts]
doc-table-engine = "doc_table_engine.cli:main"
doc-table-worker = "doc_table_engine.worker:main"

[tool.setuptools.packages.find]
where = ["src"]
