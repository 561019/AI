[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "analysis-prediction-engine"
version = "0.1.0"
description = "Deterministic L2 analysis and prediction engine"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2,<3",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
test = [
    "pytest",
    "httpx",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
